<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>AR Microwave - Hiro Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      z-index: 999;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);

      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 15px 24px;

      color: white;
      font-size: 18px;
      font-weight: bold;

      background: rgba(20, 20, 20, 0.9);
      box-shadow: 0 5px 15px rgba(0,0,0,.35);

      cursor: pointer;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(.95);
    }

    #warmBtn {
      background: #e85d04;
    }

    #doorBtn {
      background: #1565c0;
    }

    #status {
      position: fixed;
      z-index: 999;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      padding: 10px 18px;
      border-radius: 20px;

      color: white;
      background: rgba(0,0,0,.7);

      font-size: 15px;
    }
  </style>
</head>

<body>

  <div id="status">
    🔍 กรุณาส่องกล้องไปที่ Hiro Marker
  </div>

  <div id="ui">
    <button id="warmBtn" class="btn">
      🔥 อุ่น
    </button>

    <button id="doorBtn" class="btn">
      🚪 เปิดฝา
    </button>
  </div>


  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- แสง -->
    <a-entity light="type: ambient; intensity: 1.8"></a-entity>

    <a-entity
      light="type: directional; intensity: 2"
      position="2 4 3">
    </a-entity>


    <!-- Hiro Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- =====================================================
           MICROWAVE
           ===================================================== -->
      <a-entity
        id="microwave"
        position="0 0 0"
        scale="0.8 0.8 0.8">


        <!-- ตัวเครื่อง -->
        <a-box
          position="0 0.75 0"
          width="2.8"
          height="1.5"
          depth="1.8"
          color="#252525"
          radius="0.08">
        </a-box>


        <!-- ช่องด้านหน้า -->
        <a-box
          position="-0.05 0.75 0.92"
          width="2.05"
          height="1.15"
          depth="0.04"
          color="#111111">
        </a-box>


        <!-- กระจกประตู -->
        <a-box
          id="door"
          position="-0.05 0.75 0.97"
          width="1.95"
          height="1.05"
          depth="0.06"
          color="#17202a"
          opacity="0.85">

          <!-- กระจกด้านใน -->
          <a-box
            position="0 0 0.04"
            width="1.75"
            height="0.85"
            depth="0.02"
            color="#050505"
            opacity="0.8">
          </a-box>

        </a-box>


        <!-- ขอบประตู -->
        <a-box
          position="-1.08 0.75 0.99"
          width="0.08"
          height="1.15"
          depth="0.08"
          color="#555">
        </a-box>


        <!-- แผงควบคุม -->
        <a-box
          position="1.08 0.75 0.93"
          width="0.48"
          height="1.15"
          depth="0.08"
          color="#303030">
        </a-box>


        <!-- หน้าจอ -->
        <a-box
          id="display"
          position="1.08 1.10 0.99"
          width="0.34"
          height="0.20"
          depth="0.03"
          color="#071a12">

          <a-text
            id="displayText"
            value="00:00"
            align="center"
            color="#00ff88"
            width="0.8"
            position="0 0 0.03">
          </a-text>

        </a-box>


        <!-- ปุ่มหมุน -->
        <a-cylinder
          position="1.08 0.78 1.0"
          radius="0.12"
          height="0.06"
          rotation="90 0 0"
          color="#aaaaaa">
        </a-cylinder>


        <!-- ปุ่มเล็ก -->
        <a-cylinder
          position="1.08 0.45 1.0"
          radius="0.08"
          height="0.05"
          rotation="90 0 0"
          color="#777">
        </a-cylinder>


        <!-- จานหมุน -->
        <a-cylinder
          id="plate"
          position="-0.05 0.12 0.30"
          radius="0.68"
          height="0.05"
          color="#dddddd">
        </a-cylinder>


        <!-- อาหารบนจาน -->
        <a-cylinder
          id="food"
          position="-0.05 0.22 0.30"
          radius="0.30"
          height="0.12"
          color="#c96b3b">
        </a-cylinder>


        <!-- แสงตอนอุ่น -->
        <a-light
          id="heatLight"
          type="point"
          color="#ff6a00"
          intensity="0"
          distance="3"
          position="0 0.7 0.7">
        </a-light>


        <!-- เอฟเฟกต์ความร้อน -->
        <a-entity id="heatEffect" visible="false">

          <a-ring
            position="-0.05 0.45 0.9"
            rotation="0 0 0"
            radius-inner="0.25"
            radius-outer="0.32"
            color="#ff5500"
            opacity="0.6">
          </a-ring>

          <a-ring
            position="-0.05 0.65 0.9"
            radius-inner="0.18"
            radius-outer="0.25"
            color="#ff9900"
            opacity="0.5">
          </a-ring>

        </a-entity>


      </a-entity>

    </a-marker>


    <!-- กล้อง AR -->
    <a-entity camera></a-entity>

  </a-scene>


<script>

  const marker = document.querySelector("#hiroMarker");

  const microwave = document.querySelector("#microwave");
  const door = document.querySelector("#door");

  const plate = document.querySelector("#plate");
  const heatLight = document.querySelector("#heatLight");
  const heatEffect = document.querySelector("#heatEffect");

  const displayText = document.querySelector("#displayText");

  const warmBtn = document.querySelector("#warmBtn");
  const doorBtn = document.querySelector("#doorBtn");

  const status = document.querySelector("#status");


  let isWarming = false;
  let isDoorOpen = false;
  let warmTimer = null;


  /* =====================================================
     ตรวจจับ Hiro Marker
     ===================================================== */

  marker.addEventListener("markerFound", () => {

    status.innerHTML = "✅ พบ Hiro Marker แล้ว";

    status.style.background = "rgba(0,130,70,.85)";

  });


  marker.addEventListener("markerLost", () => {

    status.innerHTML = "🔍 ส่องกล้องไปที่ Hiro Marker";

    status.style.background = "rgba(0,0,0,.7)";

  });


  /* =====================================================
     ปุ่มอุ่นอาหาร
     ===================================================== */

  warmBtn.addEventListener("click", () => {

    // ถ้ากำลังอุ่นอยู่ ให้หยุด
    if (isWarming) {

      stopHeating();

      return;
    }


    // ถ้าเปิดประตูอยู่ ห้ามอุ่น
    if (isDoorOpen) {

      status.innerHTML = "⚠️ กรุณาปิดประตูก่อนอุ่น";

      return;
    }


    startHeating();

  });


  function startHeating() {

    isWarming = true;

    warmBtn.innerHTML = "⏹ หยุดอุ่น";

    warmBtn.style.background = "#b71c1c";


    // เปิดไฟความร้อน
    heatLight.setAttribute(
      "light",
      "intensity",
      "2.5"
    );

    heatEffect.setAttribute(
      "visible",
      true
    );


    // เริ่มหมุนจาน
    plate.setAttribute(
      "animation",
      "property: rotation; to: 0 360 0; loop: true; dur: 1200; easing: linear"
    );


    // แสดงเวลา
    let seconds = 30;

    displayText.setAttribute(
      "value",
      "00:30"
    );


    status.innerHTML = "🔥 กำลังอุ่นอาหาร...";


    warmTimer = setInterval(() => {

      seconds--;

      let sec =
        String(seconds).padStart(2, "0");

      displayText.setAttribute(
        "value",
        "00:" + sec
      );


      if (seconds <= 0) {

        stopHeating();

        status.innerHTML =
          "✅ อุ่นอาหารเสร็จแล้ว!";

      }

    }, 1000);

  }


  function stopHeating() {

    isWarming = false;

    clearInterval(warmTimer);

    warmTimer = null;


    warmBtn.innerHTML = "🔥 อุ่น";

    warmBtn.style.background = "#e85d04";


    heatLight.setAttribute(
      "light",
      "intensity",
      "0"
    );


    heatEffect.setAttribute(
      "visible",
      false
    );


    plate.removeAttribute(
      "animation"
    );


    displayText.setAttribute(
      "value",
      "00:00"
    );

  }


  /* =====================================================
     เปิด / ปิด ประตูไมโครเวฟ
     ===================================================== */

  doorBtn.addEventListener("click", () => {

    if (isDoorOpen) {

      closeDoor();

    } else {

      openDoor();

    }

  });


  function openDoor() {

    // ถ้ากำลังอุ่น ให้หยุดก่อน
    if (isWarming) {

      stopHeating();

    }


    isDoorOpen = true;

    doorBtn.innerHTML = "🔒 ปิดฝา";

    doorBtn.style.background = "#2e7d32";


    status.innerHTML =
      "🚪 เปิดประตูไมโครเวฟ";


    /*
      จำลองการเปิดประตูด้วยการหมุนออกด้านหน้า
    */
    door.setAttribute(
      "animation__open",
      "property: rotation; to: 0 -65 0; dur: 700; easing: easeOutCubic"
    );


    door.setAttribute(
      "animation__move",
      "property: position; to: -0.95 0.75 1.15; dur: 700; easing: easeOutCubic"
    );

  }


  function closeDoor() {

    isDoorOpen = false;

    doorBtn.innerHTML = "🚪 เปิดฝา";

    doorBtn.style.background = "#1565c0";


    status.innerHTML =
      "🔒 ปิดประตูไมโครเวฟ";


    door.setAttribute(
      "animation__open",
      "property: rotation; to: 0 0 0; dur: 700; easing: easeInOutCubic"
    );


    door.setAttribute(
      "animation__move",
      "property: position; to: -0.05 0.75 0.97; dur: 700; easing: easeInOutCubic"
    );

  }

</script>

</body>
</html>
